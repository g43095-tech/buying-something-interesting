name: Auto AliExpress Shop

on:
  schedule:
    # 4 ריצות ביום (09:00, 13:00, 17:00, 21:00 שעון ישראל)
    - cron: '0 7,11,15,19 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: auto-aliexpress-shop
  cancel-in-progress: false

jobs:
  fetch-for-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: check
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_SECRET_KEY is not set; skipping this run."
          elif [ -z "$ALIEXPRESS_APP_KEY" ] || [ -z "$ALIEXPRESS_APP_SECRET" ] || [ -z "$ALIEXPRESS_TRACKING_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AliExpress keys are not set; skipping product fetching. The site is still built and deployed."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch products into the review queue
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_URL: 'https://louxyixmnftfqcfjkxsz.supabase.co'
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOP_ITEMS_PER_RUN: '8'
          SHOP_PENDING_LIMIT: '40'
          SHOP_MIN_SALES: '100'
          SHOP_MIN_RATING_PCT: '92'
          SHOP_MIN_COMMISSION_PCT: '4'
          SHOP_MIN_PRICE: '15'
          SHOP_MAX_PRICE: '400'
        run: node scripts/fetch_aliexpress_shop.mjs

      - name: Refresh prices and remove dead products
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_URL: 'https://louxyixmnftfqcfjkxsz.supabase.co'
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          SHOP_MAX_MISSING: '3'
        run: node scripts/refresh_aliexpress_shop.mjs

      - name: Export catalog backup
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          mkdir -p backups
          curl -fsS "https://louxyixmnftfqcfjkxsz.supabase.co/rest/v1/shop_products?select=*&order=id" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -o "backups/shop-products-$(date -u +%F).json"

      - name: Upload catalog backup
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shop-catalog-backup
          path: backups/
          retention-days: 30

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not set; skipping failure notification."
            exit 0
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=ריצת החנות נכשלה: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  build-pages:
    runs-on: ubuntu-latest
    needs: fetch-for-review
    if: always()
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check configuration
        id: check
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build product and category pages
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_URL: 'https://louxyixmnftfqcfjkxsz.supabase.co'
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SHOP_SITE_URL: ${{ vars.SHOP_SITE_URL }}
        run: node scripts/build_shop_pages.mjs

      - name: Setup Pages
        if: steps.check.outputs.configured == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: aliexpress-store

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.configured == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not set; skipping failure notification."
            exit 0
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=בניית דפי החנות נכשלה: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
